[project]
name = "baduser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "typer>=0.12",
    "faker>=25.0",
    # Main, not optional: `uv run` re-syncs to the declared extras, so an optional
    # mistralai gets UNINSTALLED by any invocation that forgets `--extra llm` -- and the
    # run then silently skips the repo read. This is a Mistral-powered tool; make it real.
    "mistralai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
web = ["browser-use>=0.1.40"]

[project.scripts]
bad-user = "baduser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The rule set lives here, not on the Makefile CLI, so `ruff check` means the same thing
# for a dev, an agent, and CI.
[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import order
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # asyncio footguns -- this codebase is almost entirely async
    "SIM",           # simplify
    "RUF",
    "BLE",           # blind except. Deliberately ON: swallowing an exception into a
                     # benign Result is this project's worst failure mode, so every
                     # bare `except Exception` must carry a noqa saying why.
]
ignore = [
    "UP042",  # `class Verdict(str, Enum)` is deliberate; StrEnum changes json behaviour
              # subtly and these enums cross the wire to the dashboard.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long assert lines in tests read better unwrapped
